spring:
  application:
    name: moapin
  profiles:
    group:
      local: dev
      prod: prod
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    jdbc:
      repositories:
        enabled: false

# Custom application namespace (shared defaults; overridden per profile)
app:
  storage:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:moapin}
    region: ${MINIO_REGION:us-east-1}
  search:
    host: ${MEILISEARCH_HOST:}
    api-key: ${MEILISEARCH_API_KEY:}
  email:
    access-key: ${SES_ACCESS_KEY:}
    secret-key: ${SES_SECRET_KEY:}
    region: ${SES_REGION:ap-northeast-2}
  jwt:
    # Prefer JWT_SECRET; fallback to APP_SECURITY_JWT_SECRET for compatibility
    secret: ${JWT_SECRET:${APP_SECURITY_JWT_SECRET:dev-insecure-change-me}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.madiest: DEBUG
