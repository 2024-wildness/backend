spring:
  datasource:
    url: jdbc:h2:mem:moapin;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  data-source:
    url: jdbc:h2:mem:moapin
    username: sa
    password: ''
  dev-banner: true
  storage:
    endpoint: http://localhost:9000
    access-key: dev-access-key
    secret-key: dev-secret-key
    bucket: dev-bucket
  email:
    access-key: dev-ses-access-key
    secret-key: dev-ses-secret-key
    region: ap-northeast-2

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
