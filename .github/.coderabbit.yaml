language: ko-KR
tone_instructions: '재미있지만 정확하고 깔끔한 내용을 말하는 아재'
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  auto_title_placeholder: '@coderabbitai'
  review_status: true
  commit_status: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true

  # --- 대상 파일 범위 ---------------------------------------------------------
  path_filters:
    - '**/*'
    - '**/gen/**'
    - '!**/test/**/gen/**'
    - '!**/.git/**'
    - '!**/target/**'
    - '!**/build/**'

  # --- 코드 리뷰 규칙 ---------------------------------------------------------
  path_instructions:
    # ──────────────────────────────
    - path: '**/*.java'
      instructions: |
        ## [공통 코딩 컨벤션]
        - **Java 21** 문법·API를 사용하되 Spring Boot **3.5.5** 호환성을 준수하세요.
        - 들여쓰기는 공백 4칸(탭 금지).
        - 메서드 길이는 **40줄** 이하, 순환 복잡도는 **10** 이하를 권장합니다.
        - `if/else`, `for`, `while` 등 모든 블록에 중괄호를 사용합니다.
        - **단일 책임 원칙(SRP)** 을 지키고, 하나의 메서드는 하나의 일을 하도록 분리합니다.
        - 불변 객체·지역 변수에는 `final`을 사용하지만,
          - 내부 클래스 사용 등 불가피한 경우는 예외로 합니다.
        - `var` 사용은 **타입 추론이 명확**할 때만 허용하며,
          캐스팅된 `null` 표현에는 `var` 사용을 허용합니다.
        - **Lombok** 은 `@Getter`, `@Setter`, `@RequiredArgsConstructor` 정도로 제한하고,
          과도한 `@Data` 사용을 지양합니다.
        - Guava 대신 **Java 21 표준 API**를 우선 사용합니다.

        ## [Spring Boot 3.5.5 특화 가이드]
        - **필드 주입(@Autowired)** 을 금지하고 **생성자 주입**을 사용합니다.
        - `@ConfigurationProperties` 기반 설정을 권장하며 `@Value` 남용을 피합니다.
        - `ApplicationEventPublisher` 사용 시 **비동기 이벤트**는 `@Async`와 함께 사용합니다.
        - **REST 컨트롤러**는 `@RestController` + `ResponseEntity<T>` 표준 응답을 사용합니다.
        - **예외**는 `@ControllerAdvice` + `@ExceptionHandler` 로 통합 처리합니다.
        - **Bean 등록** 시 `@Bean` 메서드에는 Return type 에 명확한 클래스를 명시합니다.

        ## [네카라쿠베당토 스타일 가이드]
        - 모든 **public** 메서드에는 **KDoc/JavaDoc**(한글 허용)을 작성합니다.
        - 서비스·도메인 레이어는 **헥사고날 아키텍처** 구조를 유지합니다.
        - `log` 라이브러리 대신 (사내 방침상) **System.out.println** 사용 규칙을 유지합니다.
        - 테스트 코드 외부에서 `@Transactional` readOnly=true 를 기본값으로 고려하세요.
        - **N+1** 문제 예방을 위해 JPA Fetch 전략과 JPQL을 검토하세요.
        - 새 의존성 추가 시 반드시 **라이선스 검토** 코멘트를 남깁니다.

    # ──────────────────────────────
    - path: '**/main/java/**/*.java'
      instructions: |
        ### [퍼블릭 Java API 변경 보고]
        - 이 프로젝트는 **안정적·하위 호환 보장**이 필수입니다.
        - **'Summary by CodeRabbit'** 섹션에,
          공개 Java API(public·protected 메서드 & `module-info.java`) 변동 사항을
          **최대 25개**까지 상세 목록화하세요.
        - 변동 사항이 없으면 *"이번 PR은 공개 Java API 변화가 없습니다."* 라고 명시합니다.
        - 코드 흐름(비공개 메서드·Java 21 상태 패턴 매칭·Guava 호출 포함)을 **깊이 분석**해
          - 메서드 추가/삭제
          - 시그니처 변경(파라미터·반환형)
          - 동작 변경(사이드이펙트, 예외, 트랜잭션 범위)  
          을 빠짐없이 기술하세요.

    # ──────────────────────────────
    - path: '**/test/java/**/*.java'
      instructions: |
        ## [테스트 코드]
        - `@SpringBootTest` + **Testcontainers** 환경을 권장합니다.
        - **경계 케이스**·예외 흐름을 포함해 커버리지를 확인합니다.
        - 테스트 메서드 이름은 `should_동작_조건` 형태(한글 허용)로 명확히 작성합니다.
        - Mocking 시 과도한 내부 구현 검증(세부 호출 횟수)보다 **행위(Behavior) 검증**을 우선합니다.
        - 코드 스타일·마이크로 최적화에는 관대하게 접근하세요.

  # PR이 닫히면 리뷰 취소
  abort_on_close: true

  # --- 자동 리뷰 --------------------------------------------------------------
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: [ 'main' ]

  # --- 활성화 도구 ------------------------------------------------------------
  tools:
    shellcheck:   { enabled: true  }
    markdownlint: { enabled: true  }
    yamllint:     { enabled: true  }
    gitleaks:     { enabled: true  }
    actionlint:   { enabled: true  }
    pmd:          { enabled: true  }
    eslint:       { enabled: true  }
    semgrep:      { enabled: true  }
    biome:        { enabled: true  }
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_only: false
      level: default
      disabled_categories: [ TYPOS, TYPOGRAPHY, CASING ]

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings: { scope: auto }
  issues:   { scope: auto }
  jira:     { project_keys: [] }
  linear:   { team_keys: [] }
  pull_requests: { scope: auto }