name: Internal Fast Smoke

on:
  pull_request:
    branches: ["dev", "main"]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - 'docs/**'
  push:
    branches: ["feature/**"]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle compile (no tests)
        run: ./gradlew compileJava -x checkstyleMain -x checkstyleTest

      - name: Build bootJar (skip tests)
        run: ./gradlew bootJar -x test

      - name: Launch app (background)
        run: |
          JAR=$(ls build/libs/*SNAPSHOT.jar | head -n1)
          echo "Launching $JAR"
          SPRING_PROFILES_ACTIVE=dev nohup java -jar "$JAR" > app.log 2>&1 & echo $! > app.pid
      
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Health OK"; exit 0; fi;
            sleep 2;
          done
          echo "Health endpoint not ready" >&2
          echo '---- Recent Logs ----'
          tail -n 200 app.log || true
          exit 1

      - name: Capture logs
        if: always()
        run: |
          tail -n 300 app.log || true

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then kill $(cat app.pid) || true; fi

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: app.log
          if-no-files-found: warn
