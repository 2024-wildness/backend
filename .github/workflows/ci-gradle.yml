# dev에 pr이 일어나는 경우 코드 확인을 합니다.
# 확인된 코드는 빌드되어 테스트을 진행합니다.
# 이상이 없는 경우에는 빌드 내용을 임시 저장하여 배포를 돕습니다.

name: CI - gradle with compile, test

on:
  pull_request:
    branches: [ "dev" ]

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.0'

      - name: Build with Gradle Wrapper
        run: gradle build -x test

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: backend/ready/build/libs/*.jar

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 빌드 위치 설정
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v3
        with:
          build-root-directory: /
