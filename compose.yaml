services:
  postgres:
    image: postgres:16-alpine
    container_name: moapin-postgres
    profiles: [ "prod" ]
    environment:
      # Fallback defaults (override in .env for secrets)
      POSTGRES_DB: ${POSTGRES_DB:-moapin}
      POSTGRES_USER: ${POSTGRES_USER:-moapin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moapin}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: moapin-redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: moapin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-moapin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-moapin}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: moapin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.8.1
    container_name: moapin-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health | grep 'available' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "7700:7700"

  app:
    # Production app service (uses Postgres)
    # Image is driven by .env -> APP_IMAGE. For prod/registry, set APP_IMAGE=registry.yukey.site/moapin-backend:<tag>.
    image: ${APP_IMAGE:-moapin-app:dev}
    profiles: [ "prod" ]
    container_name: moapin-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      meilisearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moapin}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-moapin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-moapin}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      # Prefer JWT_SECRET; APP_SECURITY_JWT_SECRET kept for backward compatibility
      JWT_SECRET: ${JWT_SECRET:-}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-}
      # MinIO wiring for S3-compatible storage
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-moapin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # MeiliSearch wiring
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-dev-master-key}
      # Swagger toggles (prod default off; enable by setting to 'true')
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Optional healthcheck (uncomment if actuator /health is publicly allowed)
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep 'status' || exit 1"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 40s

  app-dev:
    # Development app service (uses H2 in-memory DB)
    image: ${APP_IMAGE:-moapin-app:dev}
    profiles: [ "dev" ]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      meilisearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-dev}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-moapin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-http://meilisearch:7700}
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-dev-master-key}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  pg_data:
  minio_data:
